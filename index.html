<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicGames - PS4 Host FW 14.00</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            margin: 0;
            padding: 20px 0;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #007acc;
            margin: 0 0 5px 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #aaaaaa;
            font-size: 15px;
            margin: 0;
        }

        /* Compatibilidad WebKit PS4: Usamos márgenes en lugar de gap en Flexbox */
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 400px;
        }

        .btn {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 2px solid #333333;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s;
            /* Separación vertical limpia para PS4 */
            margin-bottom: 12px; 
        }

        /* Efecto visual cuando el mando de la PS4 selecciona el botón */
        .btn:focus, .btn:hover {
            background-color: #007acc;
            border-color: #00a2ff;
            outline: none;
        }

        /* Corrección del espacio entre el ícono SVG y el texto */
        .btn svg {
            margin-right: 15px;
            flex-shrink: 0;
        }

        .linux-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* PANTALLA DE CARGA (OCULTA POR DEFECTO) */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333333;
            border-top: 5px solid #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 24px;
            color: #007acc;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Contenido Principal del Menú -->
    <div id="content-area">
        <div class="header-container">
            <h1>MagicGames</h1>
            <p id="subtitulo">Host WebKit Estable para Firmware 14.00</p>
        </div>

        <div class="menu-container" id="menu-principal">
            
            <!-- Al presionar, llamamos a la función iniciarCarga pasándole la URL destino -->
            <button class="btn" onclick="iniciarCarga('jb.html?log=1&afterglow=run&mode=goldhen')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Cargar GoldHEN (v2.4b18.13)
            </button>

            <button class="btn" onclick="iniciarCarga('jb.html?log=1&afterglow=run&mode=hen222')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                PS4HEN Beta 2.22
            </button>

            <button class="btn" onclick="iniciarCarga('jb.html?log=1&afterglow=run&mode=linux')">
                <svg class="linux-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <ellipse cx="12" cy="8" rx="4.5" ry="5.5"/>
                    <ellipse cx="12" cy="16.5" rx="6" ry="6"/>
                    <ellipse cx="7" cy="21.5" rx="3" ry="1.5"/>
                    <ellipse cx="17" cy="21.5" rx="3" ry="1.5"/>
                </svg>
                Cargar Linux (Requiere USB)
            </button>

            <button class="btn" onclick="iniciarCarga('jb.html?log=1&afterglow=run&mode=disableupdates')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                Disable Updates (Bloquear Actualizaciones)
            </button>

            <button class="btn" onclick="iniciarCarga('jb.html?log=1&afterglow=run&mode=enableupdates')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Enable Updates (Permitir Actualizaciones)
            </button>

        </div>
    </div>

    <!-- PANTALLA DE SUBMENÚ DE CARGA (OCULTA HASTA QUE SE PRESIONE UN BOTÓN) -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <script>
        // Función para ocultar el menú y activar el submenú de carga transitoria
        function iniciarCarga(urlDestino) {
            // Ocultamos el menú principal
            document.getElementById('content-area').style.display = 'none';
            // Mostramos la pantalla limpia de Loading
            var pantallaCarga = document.getElementById('loading-screen');
            pantallaCarga.style.display = 'flex';
            
            // Le damos una pequeña pausa de 800ms para que la PS4 renderice la pantalla de carga antes de saltar al exploit
            setTimeout(function() {
                location.href = urlDestino;
            }, 800);
        }

        // Forzamos el foco automático al primer botón para el mando de la PS4
        window.onload = function () {
            var primerBoton = document.querySelector('#menu-principal .btn');
            if (primerBoton) {
                primerBoton.focus();
            }
        };
    </script>

</body>
</html>
