<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicGames - PS4 14.00 Host Único</title>
    <style>
        body {
            background-color: #003791; /* Azul clásico de PlayStation */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .header-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-top: 50px;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6);
        }
        .subtitle {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 40px;
            color: #FFCC00; /* Letras doradas */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 360px;
            margin-top: auto;
            margin-bottom: auto;
            z-index: 1;
        }
        .hidden { display: none !important; }
        
        .btn {
            background-color: #00CC44;
            color: #ffffff;
            border: 2px solid #00AA33;
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-back { background-color: #555555; border: 2px solid #444444; margin-top: 10px; }
        
        .btn:hover, .btn:focus {
            background-color: #00FF55;
            color: #000000;
            transform: scale(1.05);
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.6);
            outline: none;
        }
        .btn-back:hover, .btn-back:focus { background-color: #888888; color: #ffffff; }

        .linux-icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }
        .btn:hover .linux-icon, .btn:focus .linux-icon { fill: #000000; }
        
        .btn small {
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.9;
            display: block;
        }

        /* Apartado exclusivo para el menú de Loading solicitado */
        .loader-box {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: auto;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .loader-circle {
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00CC44; /* Animación verde */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Scripts reales del WebKit de la PS4 14.00 -->
    <script src="exploit/webkit.js"></script>
    <script src="exploit/offsets.js"></script>
    <script src="exploit/payload_loader.js"></script>
    
    <script>
        function mostrarSubmenu(idMostrar, idOcultar) {
            document.getElementById(idOcultar).classList.add('hidden');
            document.getElementById(idMostrar).classList.remove('hidden');
            setTimeout(function() {
                var primerBoton = document.getElementById(idMostrar).querySelector('.btn');
                if (primerBoton) primerBoton.focus();
            }, 50);
        }

        function lanzarNotificacionOrbisOS(mensajeTexto) {
            if (window.orbisNotify) {
                window.orbisNotify(mensajeTexto);
            } else if (window.custom_alert) {
                window.custom_alert(mensajeTexto);
            }
        }

        // MOTOR DE INYECCIÓN DE PAYLOADS REAL (.BIN)
        function ejecutarExploitReal(nombrePayload) {
            // Oculta todas las interfaces visuales de botones e inicializa el submenú de Loading limpio
            document.getElementById('menu-principal').classList.add('hidden');
            document.getElementById('menu-hack').classList.add('hidden');
            document.getElementById('menu-linux').classList.add('hidden');
            document.getElementById('submenu-loading').classList.remove('hidden');

            setTimeout(function() {
                try {
                    // Dispara las llamadas de desbordamiento de memoria nativas en tu PS4
                    initWebKit(); 
                    initKernel(); 
                    
                    // Descarga asíncrona del búfer de bytes desde los servidores de GitHub Pages
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', "payloads/" + nombrePayload, true);
                    xhr.responseType = 'arraybuffer';
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            var pBytes = new Uint8Array(xhr.response);
                            // Carga los bytes directamente en la inyección de la RAM de la consola
                            if (typeof p_loader === 'function') {
                                p_loader(pBytes);
                            } else if (typeof load_payload_from_buffer === 'function') {
                                load_payload_from_buffer(pBytes);
                            }
                        }
                    };
                    xhr.send();

                } catch (e) {
                    // Si ocurre fragmentación de memoria (común en 14.00), el script limpia la caché y recarga
                    setTimeout(function() { window.location.reload(); }, 2000);
                }
            }, 1000);
        }

        function manejarBoton(nombreArchivo) {
            if (nombreArchivo.includes("linux")) {
                var avisoInstalacion = "REQUISITO LINUX:\nAsegurate de contar con los archivos bzImage e initramfs.cpio.gz en la raiz de un almacenamiento USB formateado en FAT32/exFAT conectado a la consola.";
                lanzarNotificacionOrbisOS(avisoInstalacion);
                
                setTimeout(function() {
                    ejecutarExploitReal(nombreArchivo);
                }, 4000);
            } else {
                ejecutarExploitReal(nombreArchivo);
            }
        }
    </script>
</head>
<body>

    <div class="header-title">MagicGames</div>

    <!-- MENÚ PRINCIPAL -->
    <div id="menu-principal" class="menu-container">

        <button class="btn" onclick="mostrarSubmenu('menu-linux', 'menu-principal')">

            </svg>
            🐧 Linux Loader
        </button>
        <button class="btn" onclick="manejarBoton('disable_updates.bin')">🔒 Disable Updates</button>
        <button class="btn" onclick="manejarBoton('enable_updates.bin')">🔓 Enable Updates</button>
    </div>

    <!-- SUBMENÚ PS4 HACK -->
    <div id="menu-hack" class="menu-container hidden">

    <!-- SUBMENÚ LINUX LOADER -->
    <div id="menu-linux" class="menu-container hidden">

            🐧 Linux Loader 1GB <small>(Recomendado: Primera Instalación)</small>

        <button class="btn btn-back" onclick="mostrarSubmenu('menu-principal', 'menu-linux')">⬅️ Volver atrás</button>

        <div>Loading...</div>
        <div class="loader-circle"></div>
    </div>

</body>
</html>
